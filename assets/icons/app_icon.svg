<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Базовый скругленный квадрат -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Центрированная композиция (сдвиг вниз на 8px для оптического баланса) -->
  <g transform="translate(0, 8)">
    <!-- Левый документ: Заявка (Эталон) -->
    <rect x="42" y="44" width="80" height="152" rx="10" fill="#F1F5F9" />
    <rect x="54" y="66" width="34" height="8" rx="4" fill="#94A3B8" />
    <rect x="54" y="90" width="56" height="10" rx="4" fill="#0F172A" />
    <rect x="54" y="114" width="56" height="10" rx="4" fill="#0F172A" />
    <rect x="54" y="138" width="44" height="10" rx="4" fill="#64748B" />

    <!-- Правый документ: Черновик ЭТрН -->
    <rect x="134" y="44" width="80" height="152" rx="10" fill="#FFFFFF" />
    <rect x="146" y="66" width="34" height="8" rx="4" fill="#94A3B8" />
    <rect x="146" y="90" width="56" height="10" rx="4" fill="#0F172A" />
    <!-- Строка критического расхождения -->
    <rect x="142" y="110" width="64" height="18" rx="5" fill="#FEE2E2" />
    <rect x="146" y="114" width="56" height="10" rx="4" fill="#EF4444" />
    <rect x="146" y="138" width="44" height="10" rx="4" fill="#64748B" />

    <!-- Линии сверки между документами -->
    <line x1="116" y1="95" x2="140" y2="95" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
    <line x1="116" y1="119" x2="140" y2="119" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />

    <!-- Бейдж валидации с чистой галочкой -->
    <circle cx="128" cy="182" r="30" fill="#10B981" />
    <path d="M115 182L124 191L143 171" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
