[project]
name = "freight-check"
version = "0.1.0"
description = "Автономная кросс-валидация транспортных документов"
readme = "README.md"
authors = [
    { name = "Alexander Lebedev", email = "lebalexevg@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "opencv-python-headless>=4.10.0",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.4.0",
    "pypdfium2>=4.30.0",
    "pyside6>=6.7.0",
    "python-docx>=1.1.0",
    "rapidfuzz>=3.9.0",
    "rapidocr-onnxruntime>=1.3.0",
    "xlrd>=2.0.1",
]

[project.scripts]
freight-check = "freight_check:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.18.0",
    "pre-commit>=3.8.0",
    "pyinstaller>=6.10.0",
    "pytest>=8.3.0",
    "reportlab>=4.2.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
