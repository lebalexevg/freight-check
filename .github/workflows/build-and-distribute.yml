name: Build and Package Windows Distribution

on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Run Build and Packaging Pipeline
        run: uv run python scripts/build.py

      - name: Archive Portable Distribution
        shell: pwsh
        run: |
          Compress-Archive -Path dist/freight-check -DestinationPath dist/freight-check-portable-windows-x64.zip

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freight-check-portable-windows-x64
          path: dist/freight-check-portable-windows-x64.zip
          retention-days: 14

      - name: Upload Inno Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freight-check-installer-windows-x64
          path: dist_installer/*.exe
          retention-days: 14

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/freight-check-portable-windows-x64.zip
            dist_installer/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
